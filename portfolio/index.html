<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8223576768449365" crossorigin="anonymous"></script>
  <title>GAME ARCADE | 無料で遊べるフリーゲームポータル</title>
  <meta name="description" content="ブラウザで今すぐ遊べる無料のオリジナルゲーム（フリーゲーム）手軽に遊べる面白いゲームを公開しています。PC・スマホ対応。" />
  <meta property="og:title" content="GAME ARCADE | 無料ブラウザゲームポータル" />
  <meta property="og:description" content="無料で遊べるフリーゲーム・ブラウザゲームを紹介しています！" />
  <meta property="og:type" content="website" />

  <!-- 構造化データ (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "GAME ARCADE",
    "url": "https://mori618.github.io/port/", 
    "description": "無料で遊べるブラウザゲーム（フリーゲーム）を紹介するゲームポータルサイト。"
  }
  </script>

  <!-- Google Fonts: Noto Sans JP, Geist, Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet" />

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* カスタムスクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    body {
      font-family: 'Noto Sans JP', 'Geist', sans-serif;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-white text-gray-900 antialiased selection:bg-blue-500 selection:text-white min-h-screen">

  <div id="root"></div>

  <script src="./texts.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    /* ── Icon Component (Lucide Replacements) ────────────────────────────── */
    function GamepadIcon({ size = 14, className = "", strokeWidth = 2.5 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
          <line x1="6" y1="12" x2="10" y2="12" />
          <line x1="8" y1="10" x2="8" y2="14" />
          <circle cx="15" cy="13" r="1" fill="currentColor" />
          <circle cx="18" cy="11" r="1" fill="currentColor" />
          <rect x="2" y="6" width="20" height="12" rx="6" />
        </svg>
      );
    }

    function SearchIcon({ size = 13, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      );
    }

    function XIcon({ size = 12, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      );
    }

    function ChevronRightIcon({ size = 18, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polyline points="9 18 15 12 9 6" />
        </svg>
      );
    }

    function PlayIcon({ size = 12, className = "", fill = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
      );
    }

    function ExternalLinkIcon({ size = 14, className = "" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
      );
    }

    /* ── Icon thumbnail ────────────────────────────────────────────────────── */
    function GameIcon({ game }) {
      const [err, setErr] = useState(false);
      const gradients = [
        "from-violet-400 to-indigo-500",
        "from-sky-400 to-blue-500",
        "from-emerald-400 to-teal-500",
        "from-amber-400 to-orange-400",
        "from-rose-400 to-pink-500",
        "from-fuchsia-400 to-purple-500",
      ];
      const g = gradients[(game.title.charCodeAt(0) || 0) % gradients.length];
      return (
        <div className="w-14 h-14 rounded-2xl overflow-hidden shrink-0 bg-gray-100 shadow-sm border border-gray-100">
          {err || !game.thumbnail ? (
            <div className={`w-full h-full bg-gradient-to-br ${g} flex items-center justify-center text-white text-xl font-bold`}>
              {game.title.charAt(0)}
            </div>
          ) : (
            <img
              src={game.thumbnail}
              alt={game.title}
              onError={() => setErr(true)}
              className="w-full h-full object-cover"
            />
          )}
        </div>
      );
    }

    /* ── Tag chip ──────────────────────────────────────────────────────────── */
    function Tag({ label }) {
      const palette = {
        ゲーム:         "bg-blue-50 text-blue-600",
        パズル:         "bg-violet-50 text-violet-600",
        アクション:     "bg-rose-50 text-rose-600",
        スコアアタック: "bg-amber-50 text-amber-600",
        クラシック:     "bg-stone-100 text-stone-500",
        言葉:           "bg-sky-50 text-sky-600",
        RPG:            "bg-emerald-50 text-emerald-600",
        ローグライク:   "bg-lime-50 text-lime-700",
        音楽:           "bg-pink-50 text-pink-600",
        戦略:           "bg-indigo-50 text-indigo-600",
        シミュレーション:"bg-teal-50 text-teal-600",
        放置:           "bg-orange-50 text-orange-600",
        カジュアル:     "bg-cyan-50 text-cyan-600",
        JavaScript:     "bg-yellow-50 text-yellow-700",
        React:          "bg-indigo-50 text-indigo-600",
      };
      return (
        <span className={`inline-block px-2.5 py-0.5 text-[11px] font-medium rounded-full ${palette[label] ?? "bg-gray-100 text-gray-500"}`}>
          {label}
        </span>
      );
    }

    /* ── Game row ──────────────────────────────────────────────────────────── */
    function GameRow({ game }) {
      return (
        <a
          href={game.detail_url}
          className={`group w-full text-left flex items-center gap-4 px-4 py-4 rounded-xl transition-colors duration-150 hover:bg-black/[0.03] ${
            game.disabled ? "opacity-40 pointer-events-none" : ""
          }`}
        >
          {/* Icon */}
          <GameIcon game={game} />

          {/* Text */}
          <div className="flex-1 min-w-0 space-y-1.5">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-semibold text-[15px] text-gray-900 leading-tight">{game.title}</span>
              {game.title_en && <span className="text-xs text-gray-400 font-normal">{game.title_en}</span>}
              {game.in_development && (
                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-50 text-amber-600 text-[10px] font-medium">
                  <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse" />
                  開発中
                </span>
              )}
            </div>
            <p className="text-[13px] text-gray-500 leading-snug line-clamp-1 max-w-xl">{game.description_short}</p>
            <div className="flex gap-1.5 flex-wrap">
              {game.tags.map((t) => <Tag key={t} label={t} />)}
            </div>
          </div>

          {/* Arrow */}
          <ChevronRightIcon size={18} className="shrink-0 text-gray-300 group-hover:text-gray-500 transition-colors" />
        </a>
      );
    }

    /* ── Main App ──────────────────────────────────────────────────────────── */
    function App() {
      const [games, setGames] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const [tag, setTag] = useState("すべて");
      const [query, setQuery] = useState("");
      const [sort, setSort] = useState("newest");
      const [searchOpen, setSearchOpen] = useState(false);

      // Fetch projects.json
      useEffect(() => {
        fetch('./projects.json')
          .then(res => {
            if (!res.ok) throw new Error(APP_TEXTS.status.fetch_error);
            return res.json();
          })
          .then(data => {
            setGames(data);
            setLoading(false);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      const allTags = useMemo(() => {
        const set = new Set();
        games.forEach(g => g.tags.forEach(t => set.add(t)));
        return ["すべて", ...Array.from(set)];
      }, [games]);

      const filtered = useMemo(() => {
        let r = games;
        if (tag !== "すべて") r = r.filter((g) => g.tags.includes(tag));
        if (query.trim()) {
          const q = query.toLowerCase();
          r = r.filter((g) => g.title.toLowerCase().includes(q) || g.description_short.toLowerCase().includes(q) || g.tags.some((t) => t.toLowerCase().includes(q)));
        }
        return [...r].sort((a, b) => {
          if (sort === "newest") return +new Date(b.created_at) - +new Date(a.created_at);
          if (sort === "oldest") return +new Date(a.created_at) - +new Date(b.created_at);
          return a.title.localeCompare(b.title, "ja");
        });
      }, [games, tag, query, sort]);

      const playable = games.filter((g) => !g.in_development && !g.disabled).length;

      return (
        <div className="min-h-screen bg-white">

          {/* Nav */}
          <nav className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100">
            <div className="max-w-2xl mx-auto px-4 sm:px-6 h-12 flex items-center justify-between gap-3">
              {/* Logo */}
              <div className="flex items-center gap-2 shrink-0">
                <div className="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center shadow-sm">
                  <GamepadIcon size={14} className="text-white" strokeWidth={2.5} />
                </div>
                <span className="font-bold text-sm text-gray-900 tracking-tight">GAME ARCADE</span>
              </div>

              {/* Search bar — expands inline */}
              <div className={`flex-1 transition-all duration-200 ${searchOpen ? "max-w-xs" : "max-w-0 overflow-hidden"}`}>
                <div className="relative">
                  <SearchIcon size={13} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" />
                  <input
                    autoFocus={searchOpen}
                    type="text"
                    placeholder="ゲームを検索..."
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    className="w-full pl-8 pr-7 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all placeholder:text-gray-400 text-gray-900"
                  />
                  {query && (
                    <button onClick={() => setQuery("")} className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                      <XIcon size={12} />
                    </button>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                {/* Tags toggle */}
                <button
                  onClick={() => setSearchOpen((v) => !v)}
                  className={`w-7 h-7 rounded-lg flex items-center justify-center transition-colors ${
                    searchOpen || query ? "bg-blue-600 text-white" : "bg-gray-100 text-gray-500 hover:bg-gray-200"
                  }`}
                  aria-label="検索"
                >
                  <SearchIcon size={13} />
                </button>
                <span className="text-[11px] text-gray-400 hidden sm:block font-mono" style={{ fontFamily: "'Geist Mono', monospace" }}>
                  {playable} games
                </span>
              </div>
            </div>

            {/* Tag bar */}
            <div className="max-w-2xl mx-auto px-4 sm:px-6 pb-2.5 flex items-center justify-between gap-3">
              <div className="flex gap-1.5 overflow-x-auto pb-0.5 no-scrollbar">
                {allTags.map((t) => (
                  <button
                    key={t}
                    onClick={() => setTag(t)}
                    className={`px-3 py-1 text-xs font-medium rounded-full whitespace-nowrap transition-colors ${
                      tag === t
                        ? "bg-blue-600 text-white"
                        : "bg-gray-100 text-gray-500 hover:bg-gray-200 hover:text-gray-700"
                    }`}
                  >
                    {t}
                  </button>
                ))}
              </div>
              <select
                value={sort}
                onChange={(e) => setSort(e.target.value)}
                className="text-xs text-gray-400 bg-transparent focus:outline-none cursor-pointer hover:text-gray-700 transition-colors shrink-0"
              >
                <option value="newest">最新順</option>
                <option value="oldest">古い順</option>
                <option value="name">名前順</option>
              </select>
            </div>
          </nav>

          <div className="max-w-2xl mx-auto px-4 sm:px-6">

            {/* Divider */}
            <div className="h-px w-full bg-gray-100 my-3" />

            {/* Loading */}
            {loading && (
              <div className="py-20 text-center space-y-2">
                <div className="inline-block w-8 h-8 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                <p className="text-xs text-gray-400">読み込み中...</p>
              </div>
            )}

            {/* Error */}
            {error && (
              <div className="py-20 text-center space-y-2 text-rose-500">
                <p className="text-sm font-semibold">{error}</p>
              </div>
            )}

            {/* List */}
            {!loading && !error && (
              <section className="-mx-4 sm:-mx-6">
                {filtered.length === 0 ? (
                  <div className="py-20 text-center space-y-2">
                    <GamepadIcon size={32} strokeWidth={1} className="mx-auto text-gray-300" />
                    <p className="text-sm text-gray-400">ゲームが見つかりませんでした</p>
                  </div>
                ) : (
                  <div className="divide-y divide-gray-50">
                    {filtered.map((g) => <GameRow key={g.id} game={g} />)}
                  </div>
                )}
              </section>
            )}

            {/* Footer */}
            <footer className="py-12 text-center text-xs text-gray-400 border-t border-gray-100 mt-4">
              © {new Date().getFullYear()} {APP_TEXTS.footer.copyright} — all games handcrafted & free
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
