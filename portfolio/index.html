<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8223576768449365"
       crossorigin="anonymous"></script>
  <title>GAME ARCADE | 無料で遊べるフリーゲームポータル</title>
  <meta name="description" content="ブラウザで今すぐ遊べる無料のオリジナルゲーム（フリーゲーム）手軽に遊べる面白いゲームを公開しています。PC・スマホ対応。" />
  <meta property="og:title" content="GAME ARCADE | 無料ブラウザゲームポータル" />
  <meta property="og:description" content="無料で遊べるフリーゲーム・ブラウザゲームを紹介しています！" />
  <meta property="og:type" content="website" />

  <!-- 構造化データ (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "GAME ARCADE",
    "url": "https://mori618.github.io/port/", 
    "description": "無料で遊べるブラウザゲーム（フリーゲーム）を紹介するゲームポータルサイト。"
  }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
          },
          colors: {
            accent: {
              DEFAULT: '#8b5cf6',
              dark: '#7c3aed',
              neon: '#c084fc',
            },
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeInScale: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(40px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
          animation: {
            fadeIn: 'fadeIn 0.4s ease both',
            fadeInScale: 'fadeInScale 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both',
            slideUp: 'slideUp 0.5s ease both',
          },
        },
      },
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <!-- React + Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* スクロールバーを非表示 */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }

    /* ベース背景色 */
    html, body {
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 背景グラデーション（固定） */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 80% 10%, rgba(139, 92, 246, 0.18), transparent 45%),
        radial-gradient(circle at 10% 80%, rgba(14, 165, 233, 0.12), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.05), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ネオンテキスト */
    .neon-title {
      background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.4));
    }

    /* カードホバーエフェクト */
    .game-card {
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .game-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .game-card:hover::before {
      opacity: 1;
    }
    .game-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(139, 92, 246, 0.2),
        0 0 30px rgba(139, 92, 246, 0.15);
    }
    .game-card:active {
      transform: translateY(-2px) scale(0.99);
    }
    .game-card.is-disabled {
      cursor: not-allowed;
      opacity: 0.65;
      filter: grayscale(80%);
    }
    .game-card.is-disabled:hover {
      transform: none;
      border-color: rgba(255, 255, 255, 0.07);
      box-shadow: none;
    }
    .game-card.is-disabled::before {
      display: none;
    }

    /* サムネイル画像のズームエフェクト */
    .thumb-wrap { 
      overflow: hidden; 
      position: relative;
    }
    .thumb-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15,23,42,0.9) 0%, rgba(15,23,42,0.2) 50%, transparent 100%);
    }
    .thumb-wrap img {
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-card:hover .thumb-wrap img {
      transform: scale(1.08);
    }
    .game-card.is-disabled:hover .thumb-wrap img {
      transform: none;
    }

    /* プレイボタンのオーバーレイ */
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(2px);
    }
    .game-card:hover .play-overlay {
      opacity: 1;
    }
    .game-card.is-disabled .play-overlay {
      display: none;
    }

    /* タグボタン */
    .tag-btn {
      transition: all 0.2s ease;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .tag-btn:hover {
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    }
    .tag-btn.active {
      background: rgba(139, 92, 246, 0.9);
      border-color: rgba(139, 92, 246, 0.8);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
    }

    /* モーダルオーバーレイ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    /* モーダルヘッダー */
    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    /* iframeコンテナ */
    .modal-iframe-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .modal-iframe-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* タグバッジ */
    .tag-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #c084fc;
    }

    /* カードのアニメーション遅延 */
    .card-delay-0 { animation-delay: 0ms; }
    .card-delay-1 { animation-delay: 60ms; }
    .card-delay-2 { animation-delay: 120ms; }
    .card-delay-3 { animation-delay: 180ms; }
    .card-delay-4 { animation-delay: 240ms; }
    .card-delay-5 { animation-delay: 300ms; }

    /* コンテンツラッパー */
    #root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    /* グリッドレイアウトのグロー効果 */
    .grid-glow {
      background: radial-gradient(circle at center, rgba(139, 92, 246, 0.03), transparent 70%);
    }

    /* スタッツバー */
    .stats-bar {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
    }
  </style>
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8223576768449365" crossorigin="anonymous"></script>
</head>
<body class="font-sans">

  <div id="root"></div>

  <script src="./texts.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    /* ===== プレースホルダーサムネイル ===== */
    function PlaceholderThumb({ title }) {
      const colors = [
        ['#8b5cf6', '#c084fc'],
        ['#f59e0b', '#fb923c'],
        ['#10b981', '#34d399'],
        ['#0ea5e9', '#38bdf8'],
        ['#ef4444', '#f87171'],
        ['#ec4899', '#f472b6'],
      ];
      const idx = (title.charCodeAt(0) || 0) % colors.length;
      const [c1, c2] = colors[idx];
      return (
        <div
          className="w-full h-full flex items-center justify-center text-white text-6xl font-black select-none"
          style={{ background: `linear-gradient(135deg, ${c1}, ${c2})` }}
        >
          {title.charAt(0)}
        </div>
      );
    }

    /* ===== ゲームカード ===== */
    function GameCard({ project, index, onOpen }) {
      const [imgError, setImgError] = useState(false);

      return (
        <div
          className={`game-card rounded-2xl animate-fadeIn card-delay-${Math.min(index, 5)} ${project.disabled ? 'is-disabled' : ''}`}
          onClick={() => { if (!project.disabled) onOpen(project); }}
          role="button"
          tabIndex={project.disabled ? -1 : 0}
          onKeyDown={(e) => { if (!project.disabled && e.key === 'Enter') onOpen(project); }}
          aria-label={`${project.title} をプレイ`}
        >
          {/* サムネイル */}
          <div className="thumb-wrap h-44 rounded-t-2xl">
            {imgError ? (
              <PlaceholderThumb title={project.title} />
            ) : (
              <img
                src={project.thumbnail}
                alt={`${project.title}のサムネイル`}
                onError={() => setImgError(true)}
                loading="lazy"
              />
            )}
            {/* プレイオーバーレイ */}
            <div className="play-overlay rounded-t-2xl">
              <div className="flex flex-col items-center gap-2">
                <div className="w-16 h-16 rounded-full bg-accent/90 flex items-center justify-center shadow-[0_0_30px_rgba(139,92,246,0.8)] backdrop-blur-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" className="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <span className="text-white text-xs font-black tracking-widest">{APP_TEXTS.card.play_now}</span>
              </div>
            </div>
          </div>

          {/* カード本文 */}
          <div className="p-4">
            <div className="flex items-start justify-between gap-2 mb-2">
              <h2 className="text-white font-black text-base leading-tight">{project.title}</h2>
              {project.in_development ? (
                <span className="shrink-0 text-[10px] font-bold text-yellow-400 bg-yellow-400/20 px-2 py-0.5 rounded border border-yellow-400/40">{APP_TEXTS.card.in_development_badge}</span>
              ) : (
                <span className="shrink-0 w-6 h-6 rounded-full bg-green-400/15 border border-green-400/40 flex items-center justify-center" title={APP_TEXTS.card.playable_title}>
                  <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                </span>
              )}
            </div>

            <p className="text-slate-400 text-xs leading-relaxed mb-3 line-clamp-2">
              {project.description_short}
            </p>

            {project.in_development && (
              <div className="mb-3 p-2 bg-yellow-500/10 border border-yellow-500/20 rounded text-yellow-200/90 text-[10px] leading-tight">
                {APP_TEXTS.card.in_development_desc}
              </div>
            )}

            {/* タグ */}
            <div className="flex flex-wrap gap-1.5">
              {project.tags.slice(0, 3).map(tag => (
                <span key={tag} className="tag-badge">{tag}</span>
              ))}
              {project.tags.length > 3 && (
                <span className="tag-badge opacity-60">+{project.tags.length - 3}</span>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ===== ゲームモーダル ===== */
    function GameModal({ project, onClose }) {
      // ESCキーで閉じる
      useEffect(() => {
        const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handleKey);
        // スクロールを止める
        document.body.style.overflow = 'hidden';
        return () => {
          window.removeEventListener('keydown', handleKey);
          document.body.style.overflow = '';
        };
      }, [onClose]);

      if (!project) return null;

      return (
        <div className="modal-overlay animate-fadeInScale" role="dialog" aria-modal="true" aria-label={`${project.title}ゲームウィンドウ`}>
          {/* ヘッダー */}
          <div className="modal-header">
            <button
              onClick={onClose}
              className="flex items-center justify-center w-9 h-9 rounded-xl bg-slate-700/70 hover:bg-red-500/80 transition-all duration-200 text-white shrink-0 border border-white/10"
              aria-label={APP_TEXTS.modal.close_aria}
            >
              <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>

            {/* タイトル */}
            <div className="flex-1 min-w-0">
              <p className="text-white font-black text-sm truncate">{project.title}</p>
              <p className="text-slate-500 text-xs truncate">{project.detail_url}</p>
            </div>

            {/* タグ（デスクトップのみ） */}
            <div className="hidden md:flex gap-1.5 shrink-0">
              {project.tags.slice(0, 3).map(tag => (
                <span key={tag} className="tag-badge">{tag}</span>
              ))}
            </div>

            {/* 別タブで開くボタン */}
            <a
              href={project.detail_url}
              target="_blank"
              rel="noopener noreferrer"
              className="flex items-center justify-center w-9 h-9 rounded-xl bg-slate-700/70 hover:bg-accent/80 transition-all duration-200 text-white shrink-0 border border-white/10"
              title={APP_TEXTS.modal.new_tab_title}
            >
              <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
            </a>
          </div>

          {/* iframeエリア */}
          <div className="modal-iframe-wrap">
            <iframe
              src={project.detail_url}
              title={project.title}
              allow="fullscreen"
            />
          </div>
        </div>
      );
    }

    /* ===== アプリ本体 ===== */
    function App() {
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedTags, setSelectedTags] = useState([]);
      const [sortKey, setSortKey] = useState('newest');
      const [activeProject, setActiveProject] = useState(null);

      useEffect(() => {
        fetch('./projects.json')
          .then(res => {
            if (!res.ok) throw new Error(APP_TEXTS.status.fetch_error);
            return res.json();
          })
          .then(data => {
            setProjects(data);
            setLoading(false);
          })
          .catch(err => { setError(err.message); setLoading(false); });
      }, []);

      const allTags = useMemo(() => {
        const set = new Set();
        projects.forEach(p => p.tags.forEach(t => set.add(t)));
        return [...set];
      }, [projects]);

      const toggleTag = useCallback(tag => {
        setSelectedTags(prev =>
          prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]
        );
      }, []);

      const filteredProjects = useMemo(() => {
        let result = projects;
        if (selectedTags.length > 0) {
          result = result.filter(p =>
            selectedTags.every(tag => p.tags.includes(tag))
          );
        }
        result = [...result].sort((a, b) => {
          if (sortKey === 'newest') return new Date(b.created_at) - new Date(a.created_at);
          if (sortKey === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
          if (sortKey === 'name')   return a.title.localeCompare(b.title, 'ja');
          return 0;
        });
        return result;
      }, [projects, selectedTags, sortKey]);

      return (
        <>
          <div className="max-w-6xl mx-auto px-4 py-16">

            {/* ===== ヘッダー ===== */}
            <header className="mb-14 text-center animate-slideUp">
              <div className="inline-flex items-center gap-2 mb-5 bg-slate-800/60 px-4 py-1.5 rounded-full border border-slate-700/80">
                <span className="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse shadow-[0_0_8px_#4ade80]"></span>
                <span className="text-xs font-black tracking-[0.2em] text-slate-300">{APP_TEXTS.header.badge}</span>
              </div>
              <h1 className="text-6xl md:text-8xl font-black tracking-tight mb-5 neon-title italic">
                {APP_TEXTS.header.title}
              </h1>
              <p className="text-slate-400 text-base md:text-lg max-w-xl mx-auto leading-relaxed font-medium">
                {APP_TEXTS.header.description}
              </p>
            </header>

            {/* コントロールパネルは表示されるゲームが1つのため非表示 */}

            {/* ===== ローディング ===== */}
            {loading && (
              <div className="text-center py-32 text-accent">
                <div className="inline-block w-10 h-10 border-4 border-accent border-t-transparent rounded-full animate-spin mb-4"></div>
                <p className="font-black tracking-widest text-sm animate-pulse">{APP_TEXTS.status.loading}</p>
              </div>
            )}

            {/* ===== エラー ===== */}
            {error && (
              <div className="text-center py-32 text-red-400">
                <span className="material-icons text-6xl mb-4 block">warning</span>
                <p className="font-bold">{error}</p>
              </div>
            )}

            {/* ===== ゲームが見つからない ===== */}
            {!loading && !error && filteredProjects.length === 0 && (
              <div className="text-center py-32 text-slate-500">
                <span className="material-icons text-7xl mb-6 opacity-20 block">sports_esports</span>
                <p className="text-xl font-bold">{APP_TEXTS.status.empty_title}</p>
                <p className="text-sm mt-2">{APP_TEXTS.status.empty_description}</p>
              </div>
            )}

            {/* ===== ゲームカードグリッド ===== */}
            {!loading && !error && filteredProjects.length > 0 && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                {filteredProjects.map((project, index) => (
                  <GameCard
                    key={project.id}
                    project={project}
                    index={index}
                    onOpen={setActiveProject}
                  />
                ))}
              </div>
            )}

          </div>

          {/* ===== フッター ===== */}
          <footer className="mt-16 py-8 border-t border-slate-800/60 text-center text-sm font-bold text-slate-600 tracking-wider">
            <p>© {new Date().getFullYear()} {APP_TEXTS.footer.copyright}</p>
            <p className="mt-1 text-xs font-normal text-slate-700">{APP_TEXTS.footer.status}</p>
          </footer>

          {/* ===== ゲームモーダル ===== */}
          {activeProject && (
            <GameModal
              project={activeProject}
              onClose={() => setActiveProject(null)}
            />
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
