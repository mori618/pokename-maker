              '0%': { opacity: 0, transform: 'translateY(40px)' },

  <style>
    /* スクロールバーを非表示 */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }

    body {
      background-color: #020617;
      /* 深いダークブルー */
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* 背景のオーブ（光のボケ）エフェクト */
    .bg-orbs::before,
    .bg-orbs::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.4;
      pointer-events: none;
    }

    .bg-orbs::before {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
    }

    .bg-orbs::after {
      bottom: -10%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
    }

    /* ネオンテキスト */
    .neon-text {
      background: linear-gradient(to right, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
    }

    /* 最強のCTAボタン */
    .btn-play {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.1) inset,
        0 15px 35px -5px rgba(139, 92, 246, 0.5),
        0 10px 20px -5px rgba(236, 72, 153, 0.4),
        0 0 20px rgba(139, 92, 246, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-play:hover {
      transform: translateY(-6px) scale(1.05);
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.2) inset,
        0 25px 45px -5px rgba(139, 92, 246, 0.7),
        0 15px 25px -5px rgba(236, 72, 153, 0.6),
        0 0 40px rgba(236, 72, 153, 0.6);
    }

    .btn-play:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
    }

    /* グラスモーフィズムカード（Bento UI用） */
    .bento-card {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .bento-card:hover {
      background: rgba(30, 41, 59, 0.6);
      border-color: rgba(139, 92, 246, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 10px 40px -10px rgba(139, 92, 246, 0.2);
    }

    /* ナンバリングのネオンリング */
    .neon-ring {
      position: relative;
    }

    .neon-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
      filter: blur(8px);
    }

    .group:hover .neon-ring::before {
      opacity: 0.7;
    }

    /* アニメーション遅延用クラス */
    .delay-100 {
      animation-delay: 100ms;
    }

    .delay-200 {
      animation-delay: 200ms;
    }

    .delay-300 {
      animation-delay: 300ms;
    }

    .delay-400 {
      animation-delay: 400ms;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("[data-text]").forEach(el => {
        const path = el.getAttribute("data-text").split('.');
        let val = APP_TEXTS;
        for (const p of path) { val = val[p]; }
        if (val) el.innerHTML = val;
      });
    });
