<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

        content="ポケモンのニックネーム（名前）を決めるためのアイデア・発想ツールです。モチーフの多国語訳、特性、イメージタグなどから、自分だけの特別なニックネームを考えるための「言葉の種」を提供します。">
    <meta name="keywords" content="ポケモン,ニックネーム,名前,アイデア,ジェネレーター,発想,由来,かっこいい,かわいい,おしゃれ,和風,語源">

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://yurand.com/nickname/"> <!-- 必要に応じて修正してください -->

    <meta property="og:description" content="ポケモンのニックネーム（名前）のアイデアをあなたのパートナーに。設定やモチーフから言葉の種を自動提案！">
    <meta property="og:image" content="https://yurand.com/nickname/og-image.png"> <!-- 画像がある場合は配置してください -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yurand.com/nickname/">
    <meta property="twitter:title" content="ポケモン ニックネームアイデアジェネレーター｜自分で決めるための発想・由来ツール">
    <meta property="twitter:description" content="ポケモンのニックネーム（名前）のアイデアをあなたのパートナーに。設定やモチーフから言葉の種を自動提案！">
    <meta property="twitter:image" content="https://yurand.com/nickname/og-image.png">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://yurand.com/nickname/">
    <link rel="icon" href="favicon.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ポケモン ニックネームアイデアジェネレーター",
      "url": "https://yurand.com/nickname/",
      "description": "ポケモンのニックネームを決めるためのアイデア発想ツール。多国語名、モチーフ、特性、イメージタグなどから言葉の種を提案。",
      "applicationCategory": "Utility",
      "operatingSystem": "All"
    }
    </script>

    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8223576768449365"
         crossorigin="anonymous"></script>
</head>

<body>
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <h1>
                    <span>ニックネームアイデア</span>
                    <span class="logo-sub">インスピレーションボード / for champions</span>
                </h1>
            </div>
            <nav class="header-nav">
            </nav>
        </div>
    </header>

    <main class="app-main">
        <section class="controls-section glass-panel">
            <h2>条件を指定する</h2>

            <div class="form-group">
                <label for="pokemon-input">
                    <span class="material-icons-round">search</span>
                    対象のポケモン (任意)
                </label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="pokemon-input" placeholder="例: ピカチュウ" autocomplete="off">
                    <ul id="suggestions-list" class="suggestions hidden"></ul>
                </div>
            </div>

            <!-- ポケモン選択時にタイプを表示するエリア（非選択時は非表示） -->
            <div class="form-group" id="pokemon-type-group" style="display:none">
                <label>
                    <span class="material-icons-round">category</span>
                    タイプ
                </label>
                <div class="pokemon-type-badges" id="pokemon-type-badges">
                    <!-- ポケモン選択時にタイプバッジがここに表示される -->
                </div>
            </div>

            <div class="form-group">
                <label>
                    <span class="material-icons-round">palette</span>
                    雰囲気 / テーマ (複数選択可)
                </label>
                <div class="theme-tags" id="theme-tags">
                    <button class="theme-btn active" data-theme="random">おまかせ</button>
                    <button class="theme-btn" data-theme="cool">かっこいい</button>
                    <button class="theme-btn" data-theme="cute">かわいい</button>
                    <button class="theme-btn" data-theme="japanese">和風</button>
                    <button class="theme-btn" data-theme="western">洋風</button>
                    <button class="theme-btn" data-theme="unique">ネタ</button>
                    <button class="theme-btn" data-theme="gibberish">ランダム</button>
                </div>
            </div>

            <button id="generate-btn" class="generate-btn primary-btn pulse-anim">
                アイデアの種を作成！
            </button>
        </section>

        <section class="results-section">
            <!-- ポケモンの設定・多国語モチーフなどを可視化するダッシュボード（初期状態は非表示） -->
            <div id="inspiration-board" class="inspiration-board hidden">
                <!-- ここに動的にHTMLが追加されます -->
            </div>

            <div class="results-header">
                <h2>提案されるアイデアの種</h2>
                <div class="results-actions">
                    <button id="regenerate-btn" class="icon-btn tooltip" data-tooltip="再提案">
                        <span class="material-icons-round">refresh</span>
                    </button>
                </div>
            </div>
            <div id="results-grid" class="results-grid">
                <div class="empty-state">
                    <span class="material-icons-round huge-icon">tips_and_updates</span>
                    <p>ポケモンを入力、またはテーマを選んで「アイデアの種を作成」ボタンを押してください</p>
                </div>
            </div>
        </section>
    </main>



    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <footer class="app-footer">
        <div class="footer-container">
            <p>&copy; 2026 ポケモン ニックネームアイデアジェネレーター</p>
            <nav class="footer-nav">
                <a href="privacy.html">プライバシーポリシー</a>
            </nav>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>

</html>
