<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GG Demon | 遊んでみよう！</title>
  <meta name="description" content="エネルギー管理と読み合いが鍵のターン制戦略バトル。次々と現れる悪魔を討伐し、タワーの頂点へ！" />
  <meta property="og:title" content="GG Demon | 究極のターン制戦略バトル" />
  <meta property="og:description" content="エネルギー管理と読み合いが鍵のターン制戦略バトル。次々と現れる悪魔を討伐し、タワーの頂点へ！" />
  <meta property="og:image" content="../images/ggdemon-thumb.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
            display: ['Inter', '"Noto Sans JP"', 'sans-serif']
          },
          colors: {
            game: {
              base: '#05050a',      // より深い漆黒
              surface: '#0d111d',   // カードのベース色
              primary: '#ff2a55',   // 鮮烈なサイバーレッド
              secondary: '#9d4edd', // ダークファンタジーな紫
              neon: '#ff003c'       // 発光用アクセント
            }
          },
          backgroundImage: {
            'cyber-grid': 'linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px)',
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
          },
          animation: {
            'float': 'float 4s ease-in-out infinite',
            'float-delayed': 'float 4s ease-in-out 2s infinite',
            'shimmer': 'shimmer 2s infinite linear',
            'glow-pulse': 'glow-pulse 3s ease-in-out infinite alternate',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-15px)' },
            },
            shimmer: {
              '0%': { transform: 'translateX(-150%) skewX(-15deg)' },
              '100%': { transform: 'translateX(250%) skewX(-15deg)' },
            },
            'glow-pulse': {
              '0%': { opacity: '0.5', filter: 'blur(20px)' },
              '100%': { opacity: '1', filter: 'blur(30px)' },
            }
          }
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      background-color: #05050a;
      color: #f8fafc;
      background-size: 40px 40px;
      overflow-x: hidden;
    }

    /* プレミアムなネオンテキストエフェクト */
    .text-neon-title {
      background: linear-gradient(to bottom right, #ffffff, #ffb3c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 42, 85, 0.6)) drop-shadow(0 0 40px rgba(157, 78, 221, 0.4));
    }

    /* 奥行きのあるカードデザイン (Glassmorphism & Bento UI) */
    .bento-card {
      background: linear-gradient(145deg, rgba(20, 25, 40, 0.7) 0%, rgba(10, 12, 20, 0.9) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .bento-card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(255, 42, 85, 0.4);
      box-shadow: 0 20px 40px -10px rgba(255, 42, 85, 0.15), 0 0 20px rgba(157, 78, 221, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* リッチなCTAボタン */
    .btn-play {
      background: linear-gradient(135deg, #ff2a55, #9d4edd);
      position: relative;
      z-index: 1;
      transition: all 0.3s ease;
    }

    .btn-play::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(135deg, #ff2a55, #9d4edd, #ff2a55);
      background-size: 200% auto;
      z-index: -1;
      filter: blur(10px);
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: shimmer 3s linear infinite;
    }

    .btn-play:hover::before {
      opacity: 1;
    }

    .btn-play:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px -5px rgba(255, 42, 85, 0.5);
    }

    .btn-play:active {
      transform: translateY(1px);
    }

    /* 画像のサイバーパンク風ボーダーエフェクト */
    .cyber-border {
      position: relative;
      border-radius: 1.5rem;
      padding: 3px;
      background: linear-gradient(45deg, #ff2a55, transparent, #9d4edd);
      z-index: 1;
    }

    .cyber-border::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 1.5rem;
      background: linear-gradient(45deg, #ff2a55, transparent, #9d4edd);
      filter: blur(15px);
      z-index: -1;
      opacity: 0.7;
    }

    /* スクロールバーを非表示 */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8223576768449365" crossorigin="anonymous"></script>
</head>

<body class="font-sans min-h-screen bg-cyber-grid relative">

  <!-- 背景のグロー効果（アンビエントライト） -->
  <div
    class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-game-primary/10 mix-blend-screen blur-[100px] pointer-events-none animate-glow-pulse">
  </div>
  <div
    class="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-game-secondary/10 mix-blend-screen blur-[120px] pointer-events-none animate-glow-pulse"
    style="animation-delay: 1.5s;"></div>

  <div class="max-w-6xl mx-auto px-6 py-10 relative z-10">



    <!-- ヒーローセクション -->
    <header class="text-center mb-24 relative">
      <div class="inline-block animate-float mb-6 relative">
        <div class="absolute inset-0 bg-game-primary/30 blur-2xl rounded-full"></div>
        <span class="material-icons text-7xl relative z-10 drop-shadow-2xl">bolt</span>
      </div>

      <h1 class="font-display text-6xl md:text-8xl lg:text-9xl font-black mb-4 tracking-tighter uppercase leading-none">
        </h1>
      <script>document.currentScript.previousElementSibling.setAttribute("data-text", "ggdemon.hero.title"); document.currentScript.previousElementSibling.innerHTML = "";</script>

      <p
        class="text-lg md:text-2xl font-medium text-slate-300 mb-12 max-w-3xl mx-auto leading-relaxed tracking-wide drop-shadow-md">
        </p>
      <script>document.currentScript.previousElementSibling.setAttribute("data-text", "ggdemon.hero.subtitle"); document.currentScript.previousElementSibling.innerHTML = "";</script>

      <div class="flex justify-center mb-20">
        <a href="https://mori618.github.io/ggdemon/" target="_blank" rel="noopener noreferrer"
          class="btn-play px-12 py-5 rounded-2xl text-white font-black text-xl md:text-2xl flex items-center gap-4 group overflow-hidden shadow-2xl">
          <div class="absolute inset-0 bg-white/20 translate-x-[-150%] skew-x-[-20deg] group-hover:animate-shimmer">
          </div>
          <svg xmlns="http://www.w3.org/2000/svg"
            class="w-8 h-8 group-hover:scale-110 group-hover:animate-pulse transition-transform" fill="currentColor"
            viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
          <span class="tracking-widest" data-text="ggdemon.hero.play_btn"></span>
        </a>
      </div>

      <!-- サムネイル画像 -->
      <div class="relative max-w-4xl mx-auto cyber-border group">
        <div class="rounded-[1.35rem] overflow-hidden bg-game-base relative">
          <img src="../images/ggdemon-thumb.jpg" alt="GG Demonのプレイ画面"
            class="w-full aspect-video object-cover group-hover:scale-105 group-hover:opacity-90 transition-all duration-700 ease-out"
            onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'w-full aspect-video bg-gradient-to-br from-gray-900 to-black flex flex-col items-center justify-center text-white gap-6 relative overflow-hidden\'><div class=\'absolute inset-0 bg-cyber-grid opacity-20\'></div><span class=\'material-icons text-8xl animate-float z-10\'>bolt</span><span class=\'text-4xl font-black tracking-widest z-10 text-neon-title\'>GG DEMON</span></div>'" />
          <div
            class="absolute inset-0 bg-gradient-to-t from-game-base via-transparent to-transparent opacity-80 pointer-events-none">
          </div>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ (Bento UI風レイアウト) -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8 mb-24">

      <!-- 熱狂のポイント (左側 / 5カラム分) -->
      <section
        class="bento-card rounded-3xl p-8 md:p-10 lg:col-span-5 flex flex-col justify-center group relative overflow-hidden">
        <!-- 装飾用背景光 -->
        <div
          class="absolute -right-20 -top-20 w-40 h-40 bg-game-primary/20 blur-3xl rounded-full group-hover:bg-game-primary/40 transition-colors duration-500">
        </div>

        <div class="relative z-10">
          <h2 class="text-2xl md:text-3xl font-black mb-8 flex items-center gap-4 text-white">
            <span class="material-icons p-3 bg-game-primary/20 rounded-xl text-game-primary shadow-[0_0_15px_rgba(255,42,85,0.3)]">whatshot</span>
            <span class="tracking-widest border-b-2 border-game-primary/30 pb-1" data-text="ggdemon.point.title"></span>
          </h2>

          <div class="space-y-8">
            <div class="border-l-2 border-game-primary/50 pl-6 group-hover:border-game-primary transition-colors">
              <p class="text-xl text-white font-bold leading-tight mb-2">
                </p>
              <script>document.currentScript.previousElementSibling.setAttribute("data-text", "ggdemon.point.desc1_title"); document.currentScript.previousElementSibling.innerHTML = "";</script>
              <p class="text-slate-400 leading-relaxed text-sm md:text-base">
                </p>
              <script>document.currentScript.previousElementSibling.setAttribute("data-text", "ggdemon.point.desc1_text"); document.currentScript.previousElementSibling.innerHTML = "";</script>
            </div>

            <div class="border-l-2 border-game-secondary/50 pl-6 group-hover:border-game-secondary transition-colors">
              <p class="text-lg text-white font-bold leading-tight mb-2">
                </p>
              <script>document.currentScript.previousElementSibling.setAttribute("data-text", "ggdemon.point.desc2_title"); document.currentScript.previousElementSibling.innerHTML = "";</script>
              <p class="text-slate-400 leading-relaxed text-sm md:text-base">
                </p>
              <script>document.currentScript.previousElementSibling.setAttribute("data-text", "ggdemon.point.desc2_text"); document.currentScript.previousElementSibling.innerHTML = "";</script>
            </div>
          </div>
        </div>
      </section>

      <!-- 遊び方 (右側 / 7カラム分) -->
      <section class="bento-card rounded-3xl p-8 md:p-10 lg:col-span-7 relative overflow-hidden group">
        <!-- 装飾用背景光 -->
        <div
          class="absolute -left-20 -bottom-20 w-60 h-60 bg-blue-500/10 blur-3xl rounded-full group-hover:bg-blue-500/20 transition-colors duration-500">
        </div>

        <div class="relative z-10 h-full flex flex-col">
          <h2 class="text-2xl md:text-3xl font-black mb-8 flex items-center gap-4 text-white">
            <span class="material-icons p-3 bg-blue-500/20 rounded-xl text-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.3)]">sports_esports</span>
            <span class="tracking-widest border-b-2 border-blue-500/30 pb-1" data-text="ggdemon.steps.title"></span>
          </h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 flex-grow">

            <!-- Step 1 -->
            <div
              class="bg-white/5 border border-white/5 rounded-2xl p-6 hover:bg-white/10 hover:border-blue-500/50 transition-all duration-300 group/step">
              <div class="flex items-center gap-4 mb-4">
                <div
                  class="w-10 h-10 rounded-lg bg-blue-500/20 text-blue-400 flex justify-center items-center font-black text-xl border border-blue-500/30 shadow-[0_0_10px_rgba(59,130,246,0.2)] group-hover/step:scale-110 transition-transform">
                  1</div>
                <h3 class="font-bold text-lg text-white" data-text="ggdemon.steps.step1_title"></h3>
              </div>
              <p class="text-slate-400 text-sm leading-relaxed" data-text="ggdemon.steps.step1_desc"></p>
            </div>

            <!-- Step 2 -->
            <div
              class="bg-white/5 border border-white/5 rounded-2xl p-6 hover:bg-white/10 hover:border-emerald-500/50 transition-all duration-300 group/step">
              <div class="flex items-center gap-4 mb-4">
                <div
                  class="w-10 h-10 rounded-lg bg-emerald-500/20 text-emerald-400 flex justify-center items-center font-black text-xl border border-emerald-500/30 shadow-[0_0_10px_rgba(16,185,129,0.2)] group-hover/step:scale-110 transition-transform">
                  2</div>
                <h3 class="font-bold text-lg text-white" data-text="ggdemon.steps.step2_title"></h3>
              </div>
              <p class="text-slate-400 text-sm leading-relaxed" data-text="ggdemon.steps.step2_desc"></p>
            </div>

            <!-- Step 3 -->
            <div
              class="bg-white/5 border border-white/5 rounded-2xl p-6 sm:col-span-2 hover:bg-white/10 hover:border-game-primary/50 transition-all duration-300 group/step relative overflow-hidden">
              <div class="absolute right-0 bottom-0 w-32 h-32 bg-game-primary/10 blur-2xl rounded-full"></div>
              <div class="relative z-10 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6">
                <div
                  class="w-12 h-12 rounded-lg bg-game-primary/20 text-game-primary flex justify-center items-center font-black text-2xl border border-game-primary/30 shadow-[0_0_15px_rgba(255,42,85,0.3)] shrink-0 group-hover/step:scale-110 group-hover/step:rotate-3 transition-transform">
                  3</div>
                <div>
                  <h3 class="font-black text-xl md:text-2xl text-white mb-2 tracking-wide" data-text="ggdemon.steps.step3_title"></h3>
                  <p class="text-slate-300 text-sm md:text-base leading-relaxed">
                    </p>
                  <script>document.currentScript.previousElementSibling.setAttribute("data-text", "ggdemon.steps.step3_desc"); document.currentScript.previousElementSibling.innerHTML = "";</script>
                </div>
              </div>
            </div>

          </div>
        </div>
      </section>
    </main>

    <!-- フッター -->
    <footer
      class="border-t border-white/10 pt-10 pb-12 flex flex-col md:flex-row justify-between items-center gap-6 relative z-10">
      <div class="flex items-center gap-3">
        <div class="px-3 py-1 rounded-md bg-white/5 border border-white/10 text-xs font-mono text-slate-400">SYS_INFO
        </div>
        <div class="text-slate-500 text-sm font-medium">
          </div>
        <script>document.currentScript.previousElementSibling.setAttribute("data-text", "ggdemon.footer.tech"); document.currentScript.previousElementSibling.innerHTML = "";</script>
      </div>


    </footer>

  </div>
  <script src="../texts.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("[data-text]").forEach(el => {
        const path = el.getAttribute("data-text").split('.');
        let val = APP_TEXTS;
        for (const p of path) { val = val[p]; }
        if (val) el.innerHTML = val;
      });
    });
  </script>
</body>

</html>
